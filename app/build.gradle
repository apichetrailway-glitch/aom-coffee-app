plugins {
    id 'com.android.application'
}

android {
    namespace 'com.aomcoffee.pos'
    compileSdk 34

    defaultConfig {
        applicationId 'com.aomcoffee.pos'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    signingConfigs {
        aom {
            storeFile file('aom.keystore')
            storePassword 'aomcoffee'
            keyAlias 'aom'
            keyPassword 'aomcoffee'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.aom
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
